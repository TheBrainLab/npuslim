metadata:
  name: "GLM5_GPTQ_Quantization_Recipe"
  description: "Quantize GLM-5 (GlmMoeDsa) with GPTQ W4A16"

resources:
  - id: glm5
    type: GLM5
    path: /data16t/npu_bak/modelscope/GLM-5
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu

  - id: calib_data
    type: C4Dataset
    num_samples: 128
    max_seq_length: 2048

recipe:
  - name: "GPTQ_Quantization"
    type: compressor
    model: "@glm5"
    dataloader:
      dataset: "@calib_data"
      batch_size: 1
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQ
      wbits: 4
      groupsize: 128
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 4
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs"
