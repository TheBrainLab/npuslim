metadata:
  name: "GLM5_W4A8_ModelslimReplica_Layer1"
  description: "modelslim 复刻 Layer 1（+旋转）：GPTQGlmRotation 残差流折叠（embed/MLA/indexer/lm_head）+ up-down 中间通道 AWQ + SSZ + SmoothQuant + 专家 RTN 底座 + 稠密 W8A8。对标 w4a8c8 完整配方（best_practice.yaml 减 C8/MTP）。见 workspace/复刻modelslim计划.md §9"

resources:
  - id: glm5
    type: GLM5
    path: /data/yult/llm_inference/models/GLM-5.2-bf16/snapshots/master/
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu           # cpu：量化主流程在 CPU 侧（Hessian/backfill），fasterquant 逐块上 GPU

  - id: calib_data
    type: MixedDomain
    data_path: dataset/calib/mixed_chat_code.jsonl
    num_samples: 48           # 对齐 modelslim 48 条短样本量级（§1.6.2 证据#6：校准域非 ppl 差距来源）
    max_seq_length: 1024

recipe:
  - name: "GPTQ_MoE_W4A8_Dense_W8A8_ReplicaLayer1"
    type: compressor
    model: "@glm5"
    dataloader:
      dataset: "@calib_data"
      batch_size: 4
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQGlmRotation   # Layer 1 = Layer 0 配方 + GLM 残差流旋转折叠（E3-4）
      wbits: 4
      act_bits: 8
      groupsize: -1
      save_backend: npu
      expert_chunk_size: 1
      layer_routing:
        - patterns:
            - "*.self_attn.*"
            - "*.mlp.shared_experts.*"
            - "*.mlp.gate_proj"
            - "*.mlp.up_proj"
            - "*.mlp.down_proj"
          wbits: 8
      max_calib_samples: 48
      blocksize: 256
      actorder: true
      quantize_mtp: false
      save_mtp_debug: false
      # 复刻组件 1：GLM 残差流旋转折叠（quarot，E3-4 管线接入）
      #   embed 右折 → 逐层（norm γ 融合含 DSA indexer + 旋转 + MLA 三套子空间）→ model.norm/lm_head
      #   seed 须与 w4a8c8 部署侧 rot.weight 一致（w4a8c8 rot.weight 仅 MTP 消费，主层全折叠）
      glm_rotation:
        block_size: -1
        seed: 2026
      # 复刻组件 2：up-down 中间通道 AWQ（modelslim flex_awq_ssz，仅 routed experts）
      scale_search:
        moe:
          method: updown_awq
          nbits: 4
          grid: 20
      # 复刻组件 3：SmoothQuant（modelslim flex_smooth_quant norm-linear，α=0.5 免搜索）
      #   显式 targets 对齐 w4a8c8 实测形态（§1.6.2 证据#3）：
      #   input_layernorm/q_a_layernorm = 1/s（非全 1）；kv_a_layernorm/post_attention_layernorm = 1（不参与）
      #   注意：up-down/ov smooth 子图未覆盖（缺口，Layer 1.5 候选）
      smooth_quant:
        alpha: 0.5
        targets:
          - norm: input_layernorm
            targets:
              - self_attn.q_a_proj
              - self_attn.kv_a_proj_with_mqa
          - norm: self_attn.q_a_layernorm
            targets:
              - self_attn.q_b_proj
      # 复刻组件 4：专家 SSZ（rtn 底座 + 迭代 LSQ scale 精修，无 GPTQ Hessian）
      expert_mode: ssz
      ssz_step: 10
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 1
      resume: true
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs_npu"


# Layer 1（+旋转）。RTN/SSZ 路径 ~3h 量级（Layer 0 实测 ~2.4min/层）。
# 判据 = wikitext ppl 对标 3.482；产物与 w4a8c8 逐 tensor 对拍（norm 全 1 / 1/s 形态、
#   router/kv_b_proj/indexer 折叠值、W4A8 scale_bias）。
# 前置冒烟：先用 glm5-tiny-w4a8_modelslim_replica_layer1.yaml 在单卡预演（同 MLA 维度，
#   6 层 8 专家，分钟级），验证折叠+快照同步+打包+保存全链。
# cd /data/yult/llm_inference/npuslim && \
# OMP_NUM_THREADS=48 \
# CUDA_VISIBLE_DEVICES=7 HF_DATASETS_CACHE=/data/yult/llm_inference/npuslim/workspace/hf_datasets_cache \
# nohup /data/yult/miniconda3/envs/npuslim/bin/python tools/run.py \
#   -c configs/glm5/gptq/glm5-w4a8_modelslim_replica_layer1.yaml \
