metadata:
  name: "GLM5_GPTQ_Quantization_Recipe"
  description: "Quantize GLM-5 (GlmMoeDsa) with GPTQ W4A16"

resources:
  - id: glm5
    type: GLM5
    path: /data/yult/llm_inference/models/GLM-5.2-bf16/snapshots/master/
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu           # cpu：量化主流程在 CPU 侧（Hessian/backfill），fasterquant 逐块上 GPU

  - id: calib_data
    type: C4Dataset
    data_path: dataset/c4/c4-train.00000.json.gz
    num_samples: 128          # 校准样本数（default: 128）；增大可降低 Hessian 退化概率
    max_seq_length: 1024      # 校准序列长度（2048 -> 1024，C4 文本不需要长序列，省显存/耗时）

recipe:
  - name: "GPTQ_Quantization"
    type: compressor
    model: "@glm5"
    dataloader:
      dataset: "@calib_data"
      batch_size: 4           # 校准前向 batch（1 -> 4，更好 GPU 利用率，减少 Python 循环）
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQ
      wbits: 4                # 权重位宽（default: 4）
      groupsize: 128          # 量化分组大小（default: 128）
      save_backend: npu       # 输出格式（default: None）；npu = per-expert 2D 存储，NPU(vLLM-Ascend) 部署必需
      expert_chunk_size: 1    # MoE 专家打包粒度（default: 1）
                              #   CH=1：per-expert GPTQModule，逐专家量化，actorder 生效（推荐，精度最优）
                              #   CH>1：BatchedGPTQModule 批量加速（num_experts/CH 次迭代），但 actorder 硬性禁用（精度略降）
      max_calib_samples: 128  # Hessian 采集样本数（default: 128），与 num_samples 保持一致
      blocksize: 256          # fasterquant 列分块（default: 128）；256 减半 Python 迭代加速，精度影响可忽略
      actorder: true          # desc_act 列排序量化（default: true）
                              #   按 Hessian 幅值降序量化列，误差传播更小，精度更好（GPTQ 关键特性，约 0.1-0.5pp）
                              #   仅 CH=1 生效；CH>1 的 Batched 模式硬性禁用 actorder
                              #   preproc_hessian 已处理 dead column，与 actorder 兼容、无冲突
      quantize_mtp: false     # 是否量化 MTP 层（default: false）；true 时 MTP 权重也走 4bit 量化
      save_mtp_debug: false   # 调试：保存 MTP 层输入到 ./mtp_debug_inputs/ 供离线分析（default: false）
    ignore_layers: []         # 跳过量化的层，支持 glob/regex（default: []）
    execution:
      mode: streaming         # 流式逐层量化（default: streaming）
      chunk_size: 1           # 流式加载层数分块（default: 1）；增大可减少加载开销但提高显存峰值
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs_npu"
