metadata:
  name: "GLM5_W8A8_Replica_P2Clip_Fold_W8Expert_Probe"
  description: >-
    W8A8 专家探针（★ 1011 P1）：p2clip_s1234 配方体系下专家位宽 4→8 上探——保留 glm_rotation /
    updown_awq / smooth_quant(αβ) 全部折叠成分；专家量化退化为 RTN(minmax int8)（SSZ/clip 为 W4
    网格精修手段，W8 无必要）；attn/dense 维持 W8A8_DYNAMIC。定位 = "≈BF16 级恢复"定价依据。

resources:
  - id: glm5
    type: GLM5
    path: /llm_infer_workspace/models/GLM-5.2-bf16/snapshots/master
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu

  - id: calib_data
    type: MixedDomain
    data_path: dataset/calib/mixed_chat_code.jsonl
    num_samples: 48
    max_seq_length: 1024

recipe:
  - name: "GPTQ_MoE_W8A8_Dense_W8A8_Replica_P2ClipFold_W8Expert"
    type: compressor
    model: "@glm5"
    dataloader:
      dataset: "@calib_data"
      batch_size: 4
      shuffle: false
      pin_memory: true
    algorithm:
      type: GPTQGlmRotation
      wbits: 8
      act_bits: 8
      groupsize: -1
      save_backend: npu
      expert_chunk_size: 1
      layer_routing:
        - patterns:
            - "*.self_attn.*"
            - "*.mlp.shared_experts.*"
            - "*.mlp.gate_proj"
            - "*.mlp.up_proj"
            - "*.mlp.down_proj"
          wbits: 8
      max_calib_samples: 48
      blocksize: 256
      actorder: true
      quantize_mtp: false
      save_mtp_debug: false
      glm_rotation:
        block_size: -1
        seed: 1234
      smooth_quant:
        alpha: 0.5
        alpha_beta_search: true
        search_step: 0.05
        act_sample_tokens: 8192
        targets:
          - norm: input_layernorm
            targets:
              - self_attn.q_a_proj
              - self_attn.kv_a_proj_with_mqa
          - norm: self_attn.q_a_layernorm
            targets:
              - self_attn.q_b_proj
        subgraphs:
          - {type: up_down, up: "mlp.up_proj", down: "mlp.down_proj"}
          - {type: up_down, up: "mlp.shared_experts.up_proj", down: "mlp.shared_experts.down_proj"}
          - {type: ov, v: "self_attn.kv_b_proj", o: "self_attn.o_proj"}
      expert_mode: rtn
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 1
      resume: true
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs_npu"
