metadata:
  name: "GLM5_W4A8_ModelslimReplica_Layer1_5_Path2_Clip_Seed1234_NoSQ"
  description: >-
    组合臂（★ 09-16，§6.8.6 R1 冲击）：p2clip_s1234（种子修复 he 至靶）+ 去 smooth_quant
    （SQ 腿归因：nosq 已证去 SQ 同时改善 ppl/he/mmlu）→ 预期 he ≥0.94+、ppl ~3.45 级。
    若 he-trunc ≥0.9512 即触发 R1 四维全超靶。
    消融（★ 09-15）：p2clip 的种子对照（旋转 seed1234）——检验 seed humaneval trade-off 在最优配方内是否成立+ per-channel
    clip-search（lo=0.5, with_ssz=true）。clip 替换专家 SSZ 的 scale 计算。

resources:
  - id: glm5
    type: GLM5
    path: /llm_infer_workspace/models/GLM-5.2-bf16/snapshots/master
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu

  - id: calib_data
    type: MixedDomain
    data_path: dataset/calib/mixed_chat_code.jsonl
    num_samples: 48
    max_seq_length: 1024

recipe:
  - name: "GPTQ_MoE_W4A8_Dense_W8A8_ReplicaLayer1_5_Path2_Clip_Seed1234_NoSQ"
    type: compressor
    model: "@glm5"
    dataloader:
      dataset: "@calib_data"
      batch_size: 4
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQGlmRotation
      wbits: 4
      act_bits: 8
      groupsize: -1
      save_backend: npu
      expert_chunk_size: 1
      layer_routing:
        - patterns:
            - "*.self_attn.*"
            - "*.mlp.shared_experts.*"
            - "*.mlp.gate_proj"
            - "*.mlp.up_proj"
            - "*.mlp.down_proj"
          wbits: 8
      max_calib_samples: 48
      blocksize: 256
      actorder: true
      quantize_mtp: false
      save_mtp_debug: false
      glm_rotation:
        block_size: -1
        seed: 1234
      scale_search:
        moe:
          method: updown_awq
          nbits: 4
          grid: 20
      expert_mode: ssz
      ssz_step: 10
      expert_clip_search:
        lo: 0.5
        hi: 1.0
        steps: 20
        with_ssz: true
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 1
      resume: true
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs_npu"
