# config.yaml

metadata:
  name: "Qwen3_Quantization_Recipe"
  description: "GPTQ W4A16 quantization for Qwen3-30B-A3B-Instruct-2507."

resources:
  - id: qwen
    type: Qwen3Model
    path: /data/yult/llm_inference/models/Qwen3-30B-A3B-Instruct-2507 #Qwen/Qwen3-30B-A3B-Instruct-2507
    device_map: cpu
    model_hub: ms

  - id: calib_data
    type: TextDataset
    data_path: dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
    num_samples: 128
    max_seq_length: 4096

recipe:
  - name: "GPTQ_Quantization"
    type: compressor
    model: "@qwen"
    dataloader:
      dataset: "@calib_data"
      batch_size: 1
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQ
      wbits: 4
      groupsize: 128
      save_backend: npu
      # expert_chunk_size 控制 MoE 3D 参数的量化路径：
      #   =1: per-expert GPTQModule，每个 expert 独立做 actorder（desc_act），精度更好但更慢
      #   >1: BatchedGPTQModule 批量量化 CH 个 expert，速度快，但无法独立重排列，actorder 被禁用
      # 当前 8 为 batched 路径；如需 actorder 请改为 1。
      # CH=8时推理慢很多，对 CH=8 打包权重可能是按 chunk 全量计算 处理——Qwen3-30B-A3B 每 token 激活 8/64 专家，CH=8 时若激活跨 8 个 chunk 就得全量算，产生大量冗余 （GLM-5 走 glm_moe_dsa 原生路径 + npuslim 的 deepseek_v2_packed_mapping patch（把 packed expert 参数映射展开，MoE kernel 按需取 chunk 内激活专家的 slice），冗余小）
      expert_chunk_size: 1
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 8
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs_npu"
