# config.yaml
# 与 qwen3_30b_a3b_2507-w4a16.yaml 完全一致，仅开启断点续跑（resume）。
# 输出目录自动派生为 outputs/qwen3/gptq/qwen3_30b_a3b_2507-w4a16_resume。

metadata:
  name: "Qwen3_Quantization_Recipe_Resume"
  description: "GPTQ W4A16 quantization for Qwen3-30B-A3B-Instruct-2507 with automatic resume."

resources:
  - id: qwen
    type: Qwen3Model
    path: /data/yult/llm_inference/models/Qwen3-30B-A3B-Instruct-2507 #Qwen/Qwen3-30B-A3B-Instruct-2507
    device_map: gpu #cpu
    model_hub: ms

  - id: calib_data
    type: TextDataset
    data_path: dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
    num_samples: 128
    max_seq_length: 4096

recipe:
  - name: "GPTQ_Quantization"
    type: compressor
    model: "@qwen"
    dataloader:
      dataset: "@calib_data"
      batch_size: 4
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQ
      wbits: 4
      groupsize: 128
      # expert_chunk_size 控制 MoE 3D 参数的量化路径：
      #   =1: per-expert GPTQModule，每个 expert 独立做 actorder（desc_act），精度更好但更慢
      #   >1: BatchedGPTQModule 批量量化 CH 个 expert，速度快，但无法独立重排列，actorder 被禁用
      # 不设置 save_backend：输出格式自动跟随运行时 backend（CUDA 环境 -> 标准 GPTQ 格式）
      expert_chunk_size: 1
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 8
      resume: true                # 断点续跑：每 chunk 完成后写 checkpoint，崩溃后同配置重启自动恢复
      # resume_state_interval: 1  # 默认即 1（每 chunk 提交一次 algo 状态），无需设置
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs"
