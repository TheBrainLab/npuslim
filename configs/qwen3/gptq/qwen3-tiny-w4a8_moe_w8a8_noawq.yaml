metadata:
  name: "Qwen3_Tiny_GPTQ_MoE_W4A8_NoAWQ"
  description: "A7 Step B dequant 约定验证：tiny Qwen3 GPTQ W4A8 无 AWQ（保存权重=直接量化源权重），用于锁定 nibble 解包约定。"

resources:
  - id: qwen3_tiny
    type: Qwen3Model
    path: /data/yult/llm_inference/npuslim/workspace/tiny_qwen3
    trust_remote_code: true
    low_cpu_mem_usage: true
    device_map: cpu

  - id: calib_data
    type: MixedDomain
    data_path: dataset/calib/mixed_chat_code.jsonl
    num_samples: 16
    max_seq_length: 512

recipe:
  - name: "GPTQ_MoE_W4A8_NoAWQ"
    type: compressor
    model: "@qwen3_tiny"
    dataloader:
      dataset: "@calib_data"
      batch_size: 2
      shuffle: true
      pin_memory: true
    algorithm:
      type: GPTQ
      wbits: 4
      act_bits: 8
      groupsize: -1
      save_backend: npu
      expert_chunk_size: 1
      layer_routing:
        - patterns:
            - "*.self_attn.*"
          wbits: 8
      max_calib_samples: 16
      blocksize: 256
      actorder: true
      # 无 scale_search：不折叠，保存权重 = 直接量化源权重
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 1
      resume: false
    saver:
      type: StreamingHuggingFaceSaver
      save_path: "./outputs_smoke/qwen3_tiny_w4a8_noawq"
