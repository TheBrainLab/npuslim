# config.yaml

metadata:
  name: "OPT_Quantization_Recipe"
  description: "INT8 dynamic quantization for OPT-125M."

resources:
  - id: opt
    type: OPTModel
    path: facebook/opt-125m
    device_map: cuda

recipe:
  - name: "INT8_Quantization"
    type: compressor
    model: "@opt"
    algorithm:
      type: INT8Dynamic
      wbits: 8
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 4
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs"
