metadata:
  name: "OPT_QuIP_Quantization_Recipe"
  description: "QuIP 4-bit quantization for OPT-125M with incoherence processing"

resources:
  - id: opt
    type: OPTModel
    path: facebook/opt-125m
    device_map: cuda

  - id: calib_data
    type: C4Dataset
    num_samples: 128
    max_seq_length: 2048

recipe:
  - name: "QuIP_Quantization"
    type: compressor
    model: "@opt"
    dataloader:
      dataset: "@calib_data"
      batch_size: 1
      shuffle: true
      pin_memory: true
    algorithm:
      type: QuIP
      wbits: 4
      quant_func: rms
      ldlq_method: ldlq
      npasses: 0
      incoh_processing: true
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 4
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs"
