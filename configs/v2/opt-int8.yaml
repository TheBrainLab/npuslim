# config.yaml

metadata:
  name: "OPT_Quantization_Recipe"
  description: "A recipe for quantizing OPT models using GPTQ and SparseGPTQ algorithms, followed by speculative fusion."

resources:
  - id: opt
    type: OPTModel
    path: facebook/opt-125m
    device_map: cuda

  # - id: calib_data
  #   type: C4Dataset
  #   num_samples: 128
  #   max_seq_length: 2048

recipe:
  - name: "INT8_Quantization"
    type: compressor
    model: "@opt"
    # data: "@calib_data"
    algorithm:
      type: INT8Dynamic
      wbits: 8
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 8
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs/OPT-125M-INT8"
