# config.yaml

metadata:
  name: "Qwen3_Quantization_Recipe"
  description: "A recipe for quantizing Qwen3 models using GPTQ and SparseGPTQ algorithms, followed by speculative fusion."

resources:
  - id: qwen3
    type: Qwen3Model
    path: Qwen/Qwen3-8B
    model_hub: hf
    device_map: cuda

  # - id: calib_data
  #   type: C4Dataset
  #   num_samples: 128
  #   max_seq_length: 2048

recipe:
  - name: "INT8_Quantization"
    type: compressor
    model: "@qwen3"
    algorithm:
      type: INT8Dynamic
      wbits: 8
    ignore_layers: []
    execution:
      mode: streaming
      chunk_size: 4
    saver:
      type: StreamingHuggingFaceSaver
      save_dir: "./outputs/Qwen3-8B-INT8"
