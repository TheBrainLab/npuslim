meta:
  type: llm
  work_dir: ./logs

model:
  type: Qwen3
  model_path: Qwen/Qwen3-0.6B
  model_hub: hf
  model_kwargs:
    trust_remote_code: true
    low_cpu_mem_usage: true
    use_cache: false
    torch_dtype: auto
    device_map: cpu
  tokenizer_kwargs:
    trust_remote_code: true

calib_dataset:
  dataset:
    type: TextDataset
    data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
    num_samples: 128
    max_seq_length: 4096
  dataloader:
    batch_size: 1
    shuffle: true
    num_workers: 0

pipeline:
  - type: ptq
    algo_name: QuIP
    ignore_layers: []
    algo_config:
      # QuIP uses 2-bit quantization by default for high compression
      w_bits: 2
      # Group size for quantization (-1 means no grouping)
      group_size: 128
      # Note: sym is not used by RMS quantization method (RMS is inherently symmetric)
      # QuIP uses RMS quantization method instead of minmax
      qfn_method: rms
      # Enable incoherence processing (key feature of QuIP)
      # These three settings enable QuIP's preprocessing pipeline:
      preproc_rescale: true   # Weight/Hessian diagonal rescaling
      preproc_proj: true      # Random orthogonal projection
      preproc_proj_mode: 2    # Butterfly mode (2 = butterfly_nopermute)
      # Enable Hessian preprocessing
      preproc_hessian: true

  - type: eval

  - type: save
    algo_name: HuggingFaceSaver
    save_dir: ./outputs
