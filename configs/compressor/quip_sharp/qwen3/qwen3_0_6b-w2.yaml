# QuIP# 2-bit quantization config for Qwen3-0.6B
# Reference: https://arxiv.org/abs/2402.04396

meta:
  type: llm
  work_dir: ./logs/quip_sharp

model:
  type: Qwen3
  model_path: Qwen/Qwen3-0.6B
  model_hub: hf
  model_kwargs:
    trust_remote_code: true
    low_cpu_mem_usage: true

calib_dataset:
  dataset:
    type: C4Dataset
    num_samples: 256
    max_seq_length: 2048
  dataloader:
    batch_size: 1

pipeline:
  - type: ptq
    algo_name: QuIPSharp
    ignore_layers: []  # Skip lm_head by adding "lm_head.*"
    algo_config:
      # Bit-width and codebook
      w_bits: 2
      codebook: E8P12

      # Incoherence processing
      incoh_mode: had
      rescale_WH: true

      # LDLQ parameters
      scale_override: -1  # Auto from codebook
      quip_tune_iters: 10
      blocksize: 128

      # Numerical precision
      use_fp64: false

      # Testing mode (skip packing)
      fake_quant: false

  - type: eval

  - type: save
    save_dir: ./outputs/qwen3-0.6b-quipsharp-w2
