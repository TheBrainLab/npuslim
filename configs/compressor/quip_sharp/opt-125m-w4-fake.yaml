# QuIP# 4-bit quantization config for OPT-125M
# Uses E8P12RVQ4B codebook (residual vector quantization)
# Reference: https://arxiv.org/abs/2402.04396

meta:
  type: llm
  work_dir: ./logs/quip_sharp

model:
  type: OPT
  model_path: facebook/opt-125m
  model_hub: hf
  model_kwargs:
    trust_remote_code: true
    low_cpu_mem_usage: true

calib_dataset:
  dataset:
    type: WikiText2Dataset
    num_samples: 256
    max_seq_length: 2048
  dataloader:
    batch_size: 1

pipeline:
  - type: ptq
    algo_name: QuIPSharp
    ignore_layers: []
    algo_config:
      # 4-bit using RVQ
      w_bits: 4
      codebook: E8P12RVQ4B

      # Incoherence processing
      incoh_mode: had
      rescale_WH: true

      # LDLQ parameters
      scale_override: -1  # Auto from codebook
      resid_scale_override: -1  # Auto from codebook (3.45)
      quip_tune_iters: 10
      blocksize: 128

      # Numerical precision
      use_fp64: false

      # Testing mode (skip packing)
      fake_quant: true

  # - type: eval

  - type: save
    algo_name: HuggingFaceSaver
    save_dir: ./outputs
