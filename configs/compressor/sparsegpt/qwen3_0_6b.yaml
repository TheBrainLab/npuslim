meta:
  type: llm
  work_dir: ./logs

model:
  type: Qwen3
  model_path: Qwen/Qwen3-0.6B
  model_hub: hf
  model_kwargs:
    trust_remote_code: true
    low_cpu_mem_usage: true
    use_cache: false
    torch_dtype: auto
    device_map: cpu
  tokenizer_kwargs:
    trust_remote_code: true

calib_dataset:
  dataset:
    type: TextDataset
    data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
    num_samples: 128
    max_seq_length: 4096
  dataloader:
    batch_size: 1
    shuffle: true
    num_workers: 0

pipeline:
  - type: sparse               
    algo_name: SparseGPT        
    ignore_layers: ["lm_head"] 
    algo_config:
      sparsity_ratio: 0.5       
      pattern: "2:4"            
      percdamp: 0.01         

  - type: eval

  - type: save
    algo_name: HuggingFaceSaver
    save_dir: ./outputs
