#  configuration of pipeline
meta:
  type: llm
  save_path: ./outputs

# Simplified Configuration for LLM compression
model:
  type: Qwen3
  model_path: Qwen/Qwen3-30B-A3B-Instruct-2507
  model_hub: ms  # ms (modelscope) or hf (huggingface)
  model_kwargs:
    trust_remote_code: true
    low_cpu_mem_usage: true
    use_cache: false
    torch_dtype: auto
    device_map: auto
  tokenizer_kwargs:
    trust_remote_code: true

# Dataset for calibration
# 这个方法不需要标定
# calib_dataset:
#   dataset:
#     type: TextDataset
#     data_path: ./dataset/sharegpt_gpt4_qwen/sharegpt_gpt4-qwen3_a22B_output.jsonl
#     num_samples: 128
#     max_seq_length: 4096
#   dataloader:
#     batch_size: 1
#     shuffle: true
#     num_workers: 0

# Post-Training Quantization
ptq:
  type: INT8Dynamic
  quant_config:
    w_bits: 8
    quant_method:
      weight: "per-channel"  # per-channel or per-tensor
      activation: "per-token"
  ignore_layers:                 # Skip quantization for these layers
    - 'lm_head'